# Fails a pull request when agent skill links or generated MCP configs are out
# of date. Fix locally with .agents/scripts/link-skills.sh and
# .agents/scripts/sync-mcp.sh, then commit the result.
name: agent config

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Skill links
        run: .agents/scripts/link-skills.sh check
      - name: MCP configs
        run: .agents/scripts/sync-mcp.sh check
      # Only the template repository runs the scripts' self-tests. In a project
      # made from it, run .agents/tests/run.sh yourself after changing a script.
      - name: Self-tests
        if: github.event.repository.is_template
        run: .agents/tests/run.sh
