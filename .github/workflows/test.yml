# Runs the template's end-to-end tests on Linux (bash 5). The workflow inside
# template/ is for projects made from the template and doesn't run here.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tools
        run: bash --version | head -n 1; jq --version; shellcheck --version | sed -n 2p || true
      - name: Tests
        run: tests/run.sh
