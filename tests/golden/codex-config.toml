# Generated from .agents/mcp/servers.json by .agents/scripts/sync-mcp.sh. Do not edit.
# Codex reads this file only in trusted projects; see .agents/AGENTS.md.

[mcp_servers.figma]
url = "https://mcp.figma.com/mcp"

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_PAT"

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
env_http_headers = { CONTEXT7_API_KEY = "CONTEXT7_API_KEY" }

[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@latest"]
startup_timeout_sec = 30

[mcp_servers.github-docker]
command = "docker"
args = ["run", "-i", "--rm", "-e", "GITHUB_PERSONAL_ACCESS_TOKEN", "-e", "GITHUB_TOOLSETS", "ghcr.io/github/github-mcp-server"]
env = { GITHUB_TOOLSETS = "repos,issues,pull_requests" }
env_vars = ["GITHUB_PERSONAL_ACCESS_TOKEN"]
